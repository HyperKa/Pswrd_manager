
spring:
  application:
    name: pswrd_manager

  datasource:
    url: jdbc:postgresql://localhost:5432/pswrd_manager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    # тут только проверка созданных таблиц
    hibernate:
      ddl-auto: none  # В разработке update, в проде validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # создание в liquibase
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true

  config:
    import: optional:file:.env[.properties]
  web:
    error:
      include-message: always

security:
  pepper: ${PEPPER}

jwt:
  secret: ${JWT_SECRET:dh37hdah1gdDaSgdyg127gd8acgsgw78d}
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    org.example.pswrd_manager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

